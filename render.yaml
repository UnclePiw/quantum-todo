services:
  - type: web
    name: quantum-todo-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quantum-todo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false

databases:
  - name: quantum-todo-db
    plan: free
    databaseName: quantum_todo
    user: quantum_todo
